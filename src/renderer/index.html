<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spotify Taskbar Player</title>
<style>
  /* ── Reset & base ─────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent:      #1DB954;
    --accent-dim:  #1aa34a;
    --bg:          rgba(18, 18, 18, 0.96);
    --bg-hover:    rgba(40, 40, 40, 0.98);
    --text:        #FFFFFF;
    --text-dim:    #b3b3b3;
    --border:      rgba(255,255,255,0.08);
    --art-size:    36px;
    --progress-w:  2.5px;
    --radius:      0px;    /* flush rectangle to blend with taskbar */
    --gap:         8px;
  }

  html, body {
    width:  100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', system-ui, sans-serif;
    -webkit-app-region: no-drag;
    user-select: none;
  }

  /* ── Widget shell ─────────────────────────────────────────── */
  #widget {
    width: 100%;
    height: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    padding: 0 8px 0 6px;
    gap: var(--gap);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
    position: relative;
    overflow: hidden;
    transition: background 0.2s;
  }
  #widget:hover { background: var(--bg-hover); }

  /* Spotify green accent bar at bottom */
  #widget::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0.6;
  }

  /* ── Album art + square progress ring ────────────────────── */
  .art-wrapper {
    position: relative;
    width:  var(--art-size);
    height: var(--art-size);
    flex-shrink: 0;
    -webkit-app-region: no-drag;
    cursor: pointer;
  }

  /* SVG progress ring behind the art */
  .art-wrapper svg {
    position: absolute;
    inset: -4px;                      /* bleed 4px outside art edges */
    width:  calc(var(--art-size) + 8px);
    height: calc(var(--art-size) + 8px);
    pointer-events: none;
    overflow: visible;
  }

  .progress-track {
    fill: none;
    stroke: rgba(255,255,255,0.08);
    stroke-width: var(--progress-w);
  }
  .progress-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: var(--progress-w);
    stroke-linecap: round;
    /* dasharray is set dynamically via JS */
    transition: stroke-dashoffset 0.9s linear;
    filter: drop-shadow(0 0 3px var(--accent));
  }

  /* Corner dots of the square path */
  .progress-dot {
    fill: var(--accent);
    r: 2.5;
    filter: drop-shadow(0 0 3px var(--accent));
  }

  /* Album art image */
  .art-wrapper img#art {
    display: block;
    width:  var(--art-size);
    height: var(--art-size);
    object-fit: cover;
    border-radius: 6px;
    background: #333;
    transition: opacity 0.3s;
  }

  .no-art {
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--art-size);
    height: var(--art-size);
    border-radius: 6px;
    background: #282828;
    color: var(--text-dim);
    font-size: 26px;
  }

  /* ── Track info ───────────────────────────────────────────── */
  .info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .artist {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Time display under artist */
  .time {
    display: none;   /* hidden in compact taskbar mode */
  }

  /* ── Controls ─────────────────────────────────────────────── */
  .controls {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }

  .btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dim);
    padding: 6px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, background 0.15s, transform 0.1s;
    line-height: 1;
  }
  .btn:hover  { color: var(--text); background: rgba(255,255,255,0.08); }
  .btn:active { transform: scale(0.88); }

  .btn svg { display: block; }

  /* Play/pause button is bigger */
  .btn-play {
    color: var(--text);
    background: var(--accent);
    padding: 7px;
  }
  .btn-play:hover  { background: var(--accent-dim); color: #fff; }
  .btn-play:active { transform: scale(0.9); }

  /* Heart / save button when active */
  .btn-heart.saved svg { fill: var(--accent); color: var(--accent); }

  /* ── Auth / No-track overlay ──────────────────────────────── */
  #overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: var(--bg);
    border-radius: var(--radius);
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 16px;
    -webkit-app-region: no-drag;
  }
  #overlay.visible { display: flex; }

  .overlay-text {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.4;
  }

  .btn-setup {
    font-size: 12px;
    font-weight: 600;
    color: #000;
    background: var(--accent);
    border: none;
    border-radius: 20px;
    padding: 6px 16px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .btn-setup:hover { background: var(--accent-dim); }

  /* ── Idle (nothing playing) ───────────────────────────────── */
  #idle {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--text-dim);
    font-size: 12px;
    -webkit-app-region: no-drag;
  }
  #idle.visible { display: flex; }
  #idle svg { opacity: 0.4; }

  /* ── Scrolling title animation ────────────────────────────── */
  @keyframes marquee {
    0%   { transform: translateX(0); }
    40%  { transform: translateX(0); }
    90%  { transform: translateX(var(--scroll-dist, -60px)); }
    100% { transform: translateX(var(--scroll-dist, -60px)); }
  }
  .title.scrolling {
    animation: marquee 6s ease-in-out infinite alternate;
  }
</style>
</head>
<body>

<!-- ── Main widget ── -->
<div id="widget">

  <!-- Album art with square progress ring -->
  <div class="art-wrapper" id="artWrapper" title="Click to open Spotify">
    <!-- SVG square progress ring (drawn dynamically) -->
    <svg id="progressSvg" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
      <!-- Track (background square path) -->
      <rect class="progress-track" x="2" y="2" width="40" height="40" rx="5" ry="5" id="trackRect" />
      <!-- Fill (progress square path) -->
      <rect class="progress-fill" x="2" y="2" width="40" height="40" rx="5" ry="5" id="fillRect" />
      <!-- Moving dot at leading edge -->
      <circle class="progress-dot" id="progressDot" cx="22" cy="2" />
    </svg>

    <!-- Album art -->
    <img id="art" src="" alt="Album art" onerror="this.style.display='none'; document.getElementById('noArt').style.display='flex';" />
    <div class="no-art" id="noArt" style="display:none;">🎵</div>
  </div>

  <!-- Track info -->
  <div class="info">
    <div class="title" id="title">Not playing</div>
    <div class="artist" id="artist">—</div>
    <div class="time" id="timeDisplay">0:00 / 0:00</div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <!-- Previous -->
    <button class="btn" id="btnPrev" title="Previous">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
      </svg>
    </button>

    <!-- Play / Pause -->
    <button class="btn btn-play" id="btnPlay" title="Play / Pause">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" id="iconPlay">
        <path d="M8 5v14l11-7z"/>
      </svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" id="iconPause" style="display:none">
        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
      </svg>
    </button>

    <!-- Next -->
    <button class="btn" id="btnNext" title="Next">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 18l8.5-6L6 6v12zm10-12v12h2V6h-2z"/>
      </svg>
    </button>

    <!-- Heart / Save -->
    <button class="btn btn-heart" id="btnHeart" title="Save to Liked Songs">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </button>
  </div>

  <!-- Auth overlay (shown when no credentials stored) -->
  <div id="overlay" class="visible">
    <div class="overlay-text">Connect Spotify to get started</div>
    <button class="btn-setup" id="btnSetup">Setup →</button>
  </div>

  <!-- Idle overlay (authenticated but nothing playing) -->
  <div id="idle">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" opacity="0.5">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>
    <span>Nothing playing</span>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
